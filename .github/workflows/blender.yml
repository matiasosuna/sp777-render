name: blender
# Personaje 3D en Blender (encapuchado): tela con simulación de cloth, look ilustrado (toon + Freestyle).
# Corre Blender LTS oficial en modo headless con Cycles CPU y sube los PNG (y el .blend) como artefacto.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script dentro de blender/'
        default: 'encapuchado.py'
      args:
        description: 'argumentos extra para el script (ej. --samples 64 --views full)'
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_VERSION: '4.2.23'
      BLENDER_SERIES: '4.2'
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/blender
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 >/dev/null
      - name: Render
        run: |
          set -o pipefail
          mkdir -p out
          nproc
          time ~/blender/blender -b --factory-startup --python-exit-code 1 \
            --python "blender/${{ inputs.script }}" -- --out out ${{ inputs.args }} 2>&1 | tee out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-out
          path: out/
          retention-days: 14
