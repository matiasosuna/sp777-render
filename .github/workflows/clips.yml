name: clips
run-name: clips ${{ inputs.modelo }} ${{ inputs.tamano }} ${{ inputs.frames }}f ${{ inputs.steps }}p
# Anima una ilustración (imagen → video) en CPU con Wan2.2 TI2V 5B (Apache 2.0) y stable-diffusion.cpp, pesos GGUF.
# Las versiones Turbo/FastWan son destiladas: 3-4 pasos con cfg 1. Los pesos (~9 GB) bajan de Hugging Face sin
# token en cada corrida (no se guardan en caché: el límite de 10 GB del repo ya lo usan imagenes y motor).
# El binario de sd.cpp es el mismo que compila imagenes.yml (misma clave de caché).
# Sale como artefacto: clip.mp4, hoja.png (8 cuadros), registro.txt (tiempos) y memoria.txt (RAM cada 5 s).
on:
  workflow_dispatch:
    inputs:
      imagen:
        description: 'imagen inicial: URL https o ruta en este repo (ej. pruebas/escribe_in.png)'
        default: 'pruebas/escribe_in.png'
      prompt:
        description: 'qué se mueve y cómo'
        required: true
      negativo:
        default: 'face, visible face, style change, photo, morphing, text, letters, blur'
      modelo:
        type: choice
        options: [turbo-q4km, turbo-q5km, fastwan-q6k, base-q4km]
        default: turbo-q4km
      tamano:
        description: 'ancho x alto, múltiplos de 32 (la imagen se escala y recorta a esto)'
        default: '480x832'
      frames:
        description: '4n+1 (33 = 2 s a 16 fps)'
        default: '33'
      fps:
        default: '16'
      steps:
        default: '4'
      seed:
        default: '42'
      extra:
        description: 'más opciones de sd-cli (ej. --flow-shift 8 --vae-tiling --cfg-scale 5)'
        default: ''
permissions: {}
env:
  SD_TAG: master-1053-5a1ba5d
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - id: cpu
        run: echo "h=$(grep -m1 -E '^flags' /proc/cpuinfo | sha1sum | cut -c1-10)" >> "$GITHUB_OUTPUT"; nproc; free -g; df -h / | tail -1; grep -m1 'model name' /proc/cpuinfo
      - uses: actions/cache/restore@v4
        id: sdc
        with:
          path: ~/sd
          key: sdcpp-${{ env.SD_TAG }}-${{ steps.cpu.outputs.h }}
      - if: steps.sdc.outputs.cache-hit != 'true'
        run: |
          t=$(date +%s)
          git clone -q --depth 1 --branch "$SD_TAG" --recursive --shallow-submodules https://github.com/leejet/stable-diffusion.cpp /tmp/sdcpp
          cmake -S /tmp/sdcpp -B /tmp/sdcpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DSD_BUILD_SHARED_LIBS=OFF >/dev/null
          cmake --build /tmp/sdcpp/build --config Release -j"$(nproc)" --target sd-cli >/dev/null
          mkdir -p ~/sd && cp "$(find /tmp/sdcpp/build -type f -name sd-cli | head -1)" ~/sd/
          echo "compilado en $(( $(date +%s) - t )) s"
      - if: steps.sdc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/sd
          key: ${{ steps.sdc.outputs.cache-primary-key }}
      - name: pesos
        env:
          MODELO: ${{ inputs.modelo }}
        run: |
          t=$(date +%s); mkdir -p ~/m; cd ~/m
          case "$MODELO" in
            turbo-q4km) D=hum-ma/Wan2.2-TI2V-5B-Turbo-GGUF/resolve/main/Wan2_2-TI2V-5B-Turbo-Q4_K_M.gguf ;;
            turbo-q5km) D=hum-ma/Wan2.2-TI2V-5B-Turbo-GGUF/resolve/main/Wan2_2-TI2V-5B-Turbo-Q5_K_M.gguf ;;
            fastwan-q6k) D=Green-Sky/FastWan2.2-TI2V-5B-FullAttn-GGUF/resolve/main/FastWan2.2-TI2V-5B-q6_k.gguf ;;
            base-q4km) D=QuantStack/Wan2.2-TI2V-5B-GGUF/resolve/main/Wan2.2-TI2V-5B-Q4_K_M.gguf ;;
          esac
          b(){ curl -fL --retry 5 --retry-all-errors -sS -o "$1" "https://huggingface.co/$2"; }
          b dif.gguf "$D" & p1=$!
          b umt5.gguf city96/umt5-xxl-encoder-gguf/resolve/main/umt5-xxl-encoder-Q5_K_M.gguf & p2=$!
          b vae.safetensors QuantStack/Wan2.2-TI2V-5B-GGUF/resolve/main/VAE/Wan2.2_VAE.safetensors & p3=$!
          wait $p1 && wait $p2 && wait $p3; ls -la; du -sh .; df -h / | tail -1
          echo "bajado en $(( $(date +%s) - t )) s"
      - name: generar
        env:
          IMG: ${{ inputs.imagen }}
          PROMPT: ${{ inputs.prompt }}
          NEG: ${{ inputs.negativo }}
          MODELO: ${{ inputs.modelo }}
          TAM: ${{ inputs.tamano }}
          FR: ${{ inputs.frames }}
          FPS: ${{ inputs.fps }}
          STEPS: ${{ inputs.steps }}
          SEED: ${{ inputs.seed }}
          EXTRA: ${{ inputs.extra }}
        run: |
          set -o pipefail; mkdir -p out/frames; t0=$(date +%s)
          W=${TAM%x*}; H=${TAM#*x}
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg >/dev/null; }
          [ -x /usr/bin/time ] || sudo apt-get install -y -qq time >/dev/null
          case "$IMG" in http*) U="$IMG" ;; *) U="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$IMG" ;; esac
          curl -fL --retry 5 -sS -o in.img "$U"
          ffmpeg -loglevel error -y -i in.img -vf "scale=$W:$H:force_original_aspect_ratio=increase,crop=$W:$H" out/entrada.png
          CFG=1.0; [ "$MODELO" = base-q4km ] && CFG=5.0
          ( while sleep 5; do echo "$(date +%T) $(free -m | awk 'NR==2{print $3}') MB"; done ) > out/memoria.txt & MEM=$!
          corre(){
            /usr/bin/time -v ~/sd/sd-cli -M vid_gen -t "$(nproc)" --mmap \
              --diffusion-model ~/m/dif.gguf --t5xxl ~/m/umt5.gguf --vae ~/m/vae.safetensors \
              -i out/entrada.png -p "$PROMPT" -n "$NEG" -W "$W" -H "$H" \
              --video-frames "$FR" --fps "$FPS" --steps "$STEPS" --cfg-scale "$CFG" \
              --sampling-method euler --flow-shift 5 -s "$SEED" $EXTRA "$@" \
              -o out/frames/f_%03d.png 2>&1 | grep -v '|.*s/it' | tee -a out/registro.txt
          }
          if ! corre; then
            echo "=== falló (¿memoria en el VAE?): reintento con --vae-tiling" | tee -a out/registro.txt
            rm -f out/frames/*; corre --vae-tiling
          fi
          kill $MEM || true
          echo "total sd-cli: $(( $(date +%s) - t0 )) s" | tee -a out/registro.txt
          echo "pico RAM usada (free): $(sort -k2 -n out/memoria.txt | tail -1)" | tee -a out/registro.txt
          ffmpeg -loglevel error -y -framerate "$FPS" -pattern_type glob -i 'out/frames/*.png' -c:v libx264 -pix_fmt yuv420p -crf 16 out/clip.mp4
          mkdir -p hoja; mapfile -t F < <(ls out/frames/*.png); N=${#F[@]}
          for i in 0 1 2 3 4 5 6 7; do cp "${F[$(( i * (N - 1) / 7 ))]}" hoja/$i.png; done
          ffmpeg -loglevel error -y -i hoja/%d.png -vf "tile=4x2" -frames:v 1 out/hoja.png
          grep -iE 'loading|completed|taking|decod|Maximum resident|Elapsed|error|warn' out/registro.txt | tail -40
          ls -la out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ inputs.modelo }}-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.png
            out/*.txt
          retention-days: 7
