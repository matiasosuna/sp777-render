name: remotion
# Render de Remotion (18/11/2026): composiciones de videos/ de spiritual-practices en un commit exacto.
# Pensado para tandas grandes: una instalación por job (node_modules y Chrome Headless Shell en caché),
# un solo bundle (`remotion bundle`) y muchos renders seguidos desde ese bundle. `partes` > 1 reparte la lista
# en varios jobs en paralelo. Un número en `frames` saca un cuadro suelto (remotion still) de cada composición;
# un rango "a-b" o vacío renderiza el mp4. Sube mp4/png, hoja de contactos de 20 cuadros y tiempos. No manda nada a Telegram.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'commit (SHA completo) de spiritual-practices'
        required: true
      comps:
        description: 'ids de composiciones, separados por coma o espacio'
        required: true
      frames:
        description: 'vacío = todo · "0" = cuadro suelto · "0-119" = rango'
        default: ''
      entry:
        description: 'entrada de Remotion dentro de videos/'
        default: 'src/munecos2/index.ts'
      stills:
        description: 'cuadros sueltos en tamaño completo (lista con comas), sacados de cada mp4'
        default: ''
      partes:
        description: 'cuántos jobs en paralelo (1-20)'
        default: '1'
      voces:
        description: 'ids de prácticas cuya voz guardada (practicas/voces.json → Telegram) va a public/reel/<id>/ (voz.wav + timeline.json)'
        default: ''
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tandas: ${{ steps.p.outputs.tandas }}
    steps:
      - id: p
        env:
          COMPS: ${{ inputs.comps }}
          PARTES: ${{ inputs.partes }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          comps = [c for c in re.split(r'[\s,]+', os.environ['COMPS']) if c]
          assert comps and all(re.fullmatch(r'[A-Za-z0-9_-]+', c) for c in comps), 'comps inválidas'
          n = max(1, min(20, int(os.environ['PARTES'] or 1), len(comps)))
          print('tandas=' + json.dumps([' '.join(comps[i::n]) for i in range(n)]))
          EOF
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tanda: ${{ fromJSON(needs.plan.outputs.tandas) }}
    env:
      COMPS: ${{ matrix.tanda }}
      FRAMES: ${{ inputs.frames }}
      ENTRY: ${{ inputs.entry }}
      STILLS: ${{ inputs.stills }}
      VOCES: ${{ inputs.voces }}
      REMOTION_DISABLE_TELEMETRY: '1'
      npm_config_yes: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: matiasosuna/spiritual-practices
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.MOTOR_KEY }}
          persist-credentials: false
          sparse-checkout: |
            videos/src
            practicas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check inputs
        run: |
          case "$ENTRY" in *..*|/*) echo "entrada inválida"; exit 1;; esac
          echo "$FRAMES" | grep -Eq '^([0-9]+(-[0-9]+)?)?$' || { echo "frames inválido"; exit 1; }
          echo "$VOCES" | grep -Eq '^[A-Za-z0-9_, -]*$' || { echo "voces inválido"; exit 1; }
          echo "$STILLS" | grep -Eq '^([0-9]+(,[0-9]+)*)?$' || { echo "stills inválido"; exit 1; }
          test -f "videos/$ENTRY"
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      # node_modules incluye la Chrome Headless Shell que baja `remotion browser ensure` (node_modules/.remotion)
      - uses: actions/cache@v4
        id: nm
        with:
          path: |
            videos/node_modules
            ~/.cache/remotion
          key: remotion-nm-v2-${{ runner.os }}-${{ hashFiles('videos/package-lock.json', 'videos/package.json') }}
      - name: install
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: videos
        timeout-minutes: 15
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund --loglevel=error; else npm install --no-audit --no-fund --loglevel=error; fi
      - name: browser
        working-directory: videos
        timeout-minutes: 10
        run: ./node_modules/.bin/remotion browser ensure < /dev/null
      # ffmpeg: el del sistema; si no está, apt con tope de 4 min; si apt se cuelga (pasó el 18/11), el que trae Remotion
      - name: ffmpeg
        timeout-minutes: 8
        run: |
          command -v ffmpeg && exit 0
          if timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null'; then exit 0; fi
          mkdir -p "$HOME/bin"
          for B in ffmpeg ffprobe; do printf '#!/bin/sh\nexec "%s/videos/node_modules/.bin/remotion" %s "$@"\n' "$GITHUB_WORKSPACE" "$B" > "$HOME/bin/$B"; chmod +x "$HOME/bin/$B"; done
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ffmpeg" -version | head -1
      - name: voices
        if: inputs.voces != ''
        timeout-minutes: 10
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          mkdir -p salida/voces
          for I in $(echo "$VOCES" | tr ',' ' '); do
            FID=$(python3 -c "import json,sys;print(json.load(open('practicas/voces.json'))[sys.argv[1]]['file_id'])" "$I")
            D=videos/public/reel/$I; mkdir -p "$D"
            python3 practicas/telegram.py bajar "$FID" voz.tgz && tar xzf voz.tgz -C "$D" && rm voz.tgz
            [ -f "$D/voz.flac" ] && ffmpeg -v error -y -i "$D/voz.flac" "$D/voz.wav" && rm "$D/voz.flac"
            cp "$D/timeline.json" "salida/voces/$I.json"
          done
      - name: bundle
        working-directory: videos
        timeout-minutes: 10
        run: |
          echo "instalación: $(( $(date +%s) - T0 )) s (caché: ${{ steps.nm.outputs.cache-hit == 'true' && 'sí' || 'no' }})" | tee -a ../tiempos.txt
          S=$(date +%s)
          ./node_modules/.bin/remotion bundle "$ENTRY" --out-dir=../bundle < /dev/null
          echo "bundle: $(( $(date +%s) - S )) s" | tee -a ../tiempos.txt
      - name: render
        working-directory: videos
        run: |
          mkdir -p ../salida; FALLO=0
          for C in $COMPS; do
            S=$(date +%s)
            if echo "$FRAMES" | grep -Eq '^[0-9]+$'; then
              ./node_modules/.bin/remotion still ../bundle "$C" "../salida/$C-$FRAMES.png" --frame="$FRAMES" < /dev/null > "../salida/$C.log" 2>&1 || { tail -c 3000 "../salida/$C.log"; FALLO=1; continue; }
            else
              R=""; [ -n "$FRAMES" ] && R="--frames=$FRAMES"
              ./node_modules/.bin/remotion render ../bundle "$C" "../salida/$C.mp4" --concurrency=100% --codec=h264 $R < /dev/null > "../salida/$C.log" 2>&1 || { tail -c 3000 "../salida/$C.log"; FALLO=1; continue; }
            fi
            echo "$C: $(( $(date +%s) - S )) s" | tee -a ../tiempos.txt
          done
          cp ../tiempos.txt ../salida/
          exit $FALLO
      - name: contact sheets
        if: always()
        run: |
          for V in salida/*.mp4; do
            [ -f "$V" ] || continue; C=$(basename "$V" .mp4); D=$(mktemp -d)
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
            for k in $(seq 1 20); do
              ffmpeg -v error -y -ss "$(python3 -c "print($DUR*($k-0.5)/20)")" -i "$V" -frames:v 1 -vf scale=270:-1 "$D/$(printf %02d $k).png"
            done
            ffmpeg -v error -y -framerate 1 -i "$D/%02d.png" -vf tile=5x4 -frames:v 1 "salida/$C-contactos.jpg"
            for n in $(echo "$STILLS" | tr ',' ' '); do
              ffmpeg -v error -y -ss "$(python3 -c "print($n/30)")" -i "$V" -frames:v 1 "salida/$C-cuadro-$n.png"
            done
            ffmpeg -v error -y -i "$V" -vf scale=540:-2 -c:v libx264 -crf 26 -preset veryfast -c:a aac -b:a 96k "salida/$C-celu.mp4" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion-${{ strategy.job-index }}
          path: salida/
          retention-days: 7
