name: galeria
on:
  workflow_dispatch:
    inputs:
      poses:
        description: 'Poses to draw, separated by ";" (each one like a «mov:» line, e.g. "sentado mudra=gyan; acostado")'
        required: true
      rama:
        description: 'Branch of the private repo to draw from'
        default: main
permissions: {}
jobs:
  hoja:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: matiasosuna/spiritual-practices
          ref: ${{ inputs.rama }}
          ssh-key: ${{ secrets.MOTOR_KEY }}
          persist-credentials: false
          sparse-checkout: |
            videos
            practicas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: galeria-v1
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          cd videos && npm install --no-audit --no-fund --silent && npx remotion browser ensure > /dev/null
      - name: draw
        env:
          POSES: ${{ inputs.poses }}
        run: |
          python -c "import os;open('poses.txt','w').write('\n'.join(p.strip() for p in os.environ['POSES'].split(';')))"
          python videos/gh_practica.py galeria poses.txt
      - uses: actions/upload-artifact@v4
        with:
          name: galeria
          path: videos/out/galeria/hoja-*.jpg
          retention-days: 3
